services:
  # 1. DataGuard Application Service (Streamlit Observability & Recovery Engine)
  dataguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataguard_platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:////app/data/dataguard.db
    volumes:
      - dataguard_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # 2. Production PostgreSQL Database (Optional Scalable Upgrade from SQLite)
  postgres:
    image: postgres:15-alpine
    container_name: dataguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataguard_db
      POSTGRES_USER: dataguard_admin
      POSTGRES_PASSWORD: dataguard_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard_admin -d dataguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dataguard_data:
    driver: local
  postgres_data:
    driver: local
